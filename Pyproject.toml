[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exito-scraper"
version = "1.0.0"
description = "Web scraping y análisis descriptivo de aires acondicionados en Éxito.com con CI/CD en GitHub Actions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "jinja2>=3.1",
    "selenium>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]
r = "exito_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src
[project.scripts]
exito-scrape"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=exito_scraper --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
